name: Testes de API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar o Newman
        run: npm ci

      - name: Rodar a coleção de testes
        run: npm test

      - name: Guardar relatórios do Newman
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-newman
          path: relatorios/
          retention-days: 30
          if-no-files-found: warn
